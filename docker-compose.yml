
services:
  app:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=CasinoDB;User Id=sa;Password=Haslo123!;TrustServerCertificate=True;Encrypt=False;
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-sk_test_51TUcQdPPVxf1VniAZ8rqcE1bysvsqwhfayIUIiLSFYtx71ynbRZH7hNZhSjoILfYDTWRt3cFypO38LS6I3Ksgb3J002cMQc8s5}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-pk_test_51TUcQdPPVxf1VniAnvyDLV9S99afdzxNdjZvOJAF1lQwZ14xDisuRFgRJCBxKvHmE4sK06u4Fa8TyEfdmszZRNiJ00IenKxDa3}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Haslo123!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Haslo123!" -Q "SELECT 1" -C -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqlserver-data:
